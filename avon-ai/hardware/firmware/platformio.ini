; PlatformIO Project Configuration File for AVON AI Hardware Visualizers
; Target: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3)
; Built-in 12x8 LED Matrix Driver

[platformio]
default_envs = uno_r4_device2
description = AVON AI 12x8 LED Matrix Fluid Network Visualizers

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = default, time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; Device 1: Tank T-104 & Pump Subsystem
[env:uno_r4_device1]
build_flags = 
    -DDEVICE_ID=1
    -DDEVICE_ROLE=\"TANK_PUMP\"
    -DSERIAL_BAUD=115200

; Device 2: Pipeline PL-1 (Waterflow Wave Animation Display)
[env:uno_r4_device2]
build_flags = 
    -DDEVICE_ID=2
    -DDEVICE_ROLE=\"PIPELINE\"
    -DSERIAL_BAUD=115200

; Device 3: Treatment Facility TRT-1 & Inflow Hub
[env:uno_r4_device3]
build_flags = 
    -DDEVICE_ID=3
    -DDEVICE_ROLE=\"TREATMENT\"
    -DSERIAL_BAUD=115200

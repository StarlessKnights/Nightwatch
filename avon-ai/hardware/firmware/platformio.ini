; PlatformIO Configuration File for AVON AI 5-Node Visualizer Network
; Target: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3)
; 12x8 Built-in LED Matrix Displays

[platformio]
default_envs = uno_r4_device2
description = AVON AI 5-Node Fluid Network Physical Visualizers

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = default, time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; Device 1: Tank T-104 & Duty/Standby Pumps (P-203 / P-204)
[env:uno_r4_device1]
build_flags = 
    -DDEVICE_ID=1
    -DDEVICE_ROLE=\"TANK_104\"
    -DSERIAL_BAUD=115200

; Device 2: Pipeline PL-1 (Upper Waterflow Visualizer)
[env:uno_r4_device2]
build_flags = 
    -DDEVICE_ID=2
    -DDEVICE_ROLE=\"PIPELINE_1\"
    -DSERIAL_BAUD=115200

; Device 3: Treatment Facility TRT-1 (Intake Hub & Backpressure)
[env:uno_r4_device3]
build_flags = 
    -DDEVICE_ID=3
    -DDEVICE_ROLE=\"TREATMENT\"
    -DSERIAL_BAUD=115200

; Device 4: Tank T-101 & Pump P-201 Subsystem
[env:uno_r4_device4]
build_flags = 
    -DDEVICE_ID=4
    -DDEVICE_ROLE=\"TANK_101\"
    -DSERIAL_BAUD=115200

; Device 5: Pipeline PL-2 (Lower Waterflow Visualizer)
[env:uno_r4_device5]
build_flags = 
    -DDEVICE_ID=5
    -DDEVICE_ROLE=\"PIPELINE_2\"
    -DSERIAL_BAUD=115200

[platformio]
default_envs = device_tank, device_pipeline, device_treatment, uno_r4_pump1, uno_r4_pump2, uno_r4_pump3, corners, minimal, api_test
src_dir = arduino/avon_matrix_node/src
include_dir = arduino/avon_matrix_node/include

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/Arduino_Modulino@^0.10.0

; Node 1: P-201 Pump (Tank T-101 Duty)
[env:device_tank]
build_flags = ${env.build_flags} -DDEVICE_ID=1

[env:uno_r4_pump1]
build_flags = ${env.build_flags} -DDEVICE_ID=1

; Node 2: P-203 Pump (Tank T-104 Duty)
[env:device_pipeline]
build_flags = ${env.build_flags} -DDEVICE_ID=2

[env:uno_r4_pump2]
build_flags = ${env.build_flags} -DDEVICE_ID=2

; Node 3: P-204 Pump (Tank T-104 Standby)
[env:device_treatment]
build_flags = ${env.build_flags} -DDEVICE_ID=3

[env:uno_r4_pump3]
build_flags = ${env.build_flags} -DDEVICE_ID=3

[env:corners]
build_flags = ${env.build_flags} -DDEVICE_ID=2 -DCORNER_TEST=1

[env:minimal]
build_flags = ${env.build_flags} -DDEVICE_ID=1 -DMINIMAL_TEST=1

[env:api_test]
build_flags = ${env.build_flags} -DDEVICE_ID=1 -DAPI_TEST=1

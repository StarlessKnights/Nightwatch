; PlatformIO Configuration File for AVON AI 5-Pump Visualizer Network
; Target: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3)
; All 5 Arduinos act as active physical pump visualizers on the 12x8 LED Matrix

[platformio]
default_envs = uno_r4_pump1
description = AVON AI 5-Pump Physical Hardware Visualizers

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = default, time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; Device 1: Pump P-203 (Duty Pump on Tank T-104)
[env:uno_r4_pump1]
build_flags = 
    -DDEVICE_ID=1
    -DPUMP_NAME=\"P-203\"
    -DSERIAL_BAUD=115200

; Device 2: Pump P-204 (Standby Pump on Tank T-104)
[env:uno_r4_pump2]
build_flags = 
    -DDEVICE_ID=2
    -DPUMP_NAME=\"P-204\"
    -DSERIAL_BAUD=115200

; Device 3: Pump P-201 (Duty Pump on Tank T-101)
[env:uno_r4_pump3]
build_flags = 
    -DDEVICE_ID=3
    -DPUMP_NAME=\"P-201\"
    -DSERIAL_BAUD=115200

; Device 4: Pump P-SRC1 (Wellhead Lift Pump 1 feeding Tank T-104)
[env:uno_r4_pump4]
build_flags = 
    -DDEVICE_ID=4
    -DPUMP_NAME=\"P-SRC1\"
    -DSERIAL_BAUD=115200

; Device 5: Pump P-SRC2 (Wellhead Lift Pump 2 feeding Tank T-101)
[env:uno_r4_pump5]
build_flags = 
    -DDEVICE_ID=5
    -DPUMP_NAME=\"P-SRC2\"
    -DSERIAL_BAUD=115200
